module_name: Multicopter Controller Framework

parameters:
  - group: Multicopter Controller Framework
    definitions:
      MC_CTRL_ALG:
        description:
          short: Multicopter control law
          long: |
            Selects which control law runs from the commanded setpoint down to
            motor moments.

            0 starts the stock chain (mc_pos_control + mc_att_control +
            mc_rate_control) and does NOT start mc_controller. Any non-zero value
            starts mc_controller in place of that chain.

            The laws mc_controller offers are independent implementations, not
            re-wrappings of the stock one. Neither 1 nor 3 holds heading; see
            MC_PD_YAWR_D and MC_EIG_BETA.

            3 works in physical units and needs its rigid-body parameters set for
            the airframe before it will fly properly: MC_EIG_IXX / IYY / IZZ and
            MC_EIG_TRQ_MAX.

            Changing between 0 and non-zero requires a reboot because it changes
            which modules the startup script launches. Changing between non-zero
            values takes effect on the next disarm; the framework never allocates
            a controller while armed.
        type: enum
        values:
          0: Stock cascade (mc_pos/att/rate_control modules)
          1: Cascaded PD (geometric attitude, no yaw control)
          2: Template controller
          3: Eigen dynamics (cross-coupled roll/pitch rate, no yaw control)
        default: 0
        reboot_required: true
        category: System

      MC_CTRL_GT:
        description:
          short: Feed the controller SIMULATOR GROUND TRUTH instead of the estimate
          long: |
            SITL / HIL ONLY, and a research tool rather than a flight setting. When set,
            VehicleStateProvider consumes vehicle_attitude_groundtruth and
            vehicle_local_position_groundtruth in place of the EKF2 outputs, so the control
            law sees a perfect state with no estimator error, no fusion lag and no
            transport delay on the state path.

            Why it exists: the spin ceiling on this airframe was an estimator failure
            (EKF2 running at 100 Hz against a 250 Hz IMU) that looked exactly like a
            control problem for days. Tuning against truth separates "these gains are
            wrong" from "the state reaching them is wrong" - one run tells you which,
            where a flight log alone cannot.

            The ground-truth topics carry the SAME message type as their estimated
            counterparts and SimulatorMavlink sets the validity flags and heading
            (SimulatorMavlink.cpp:59-88), so this is a drop-in substitution.

            On real hardware nothing publishes these topics, the subscriptions stay empty,
            and the controller keeps its last state - which is why this must never be left
            on outside simulation.
        type: int32
        default: 0
        values:
          0: Estimator (vehicle_attitude / vehicle_local_position)
          1: Ground truth (simulation only)

      MC_CTRL_WD_MS:
        description:
          short: Controller output watchdog timeout
          long: |
            Latch the fallback controller if the selected controller produces no
            valid output for this long while armed. The fallback is the cascaded PD
            law (MC_CTRL_ALG=1), which is always allocated; it is not the stock
            cascade, since reaching that requires a reboot.
        type: int32
        default: 50
        unit: ms
        min: 5
        max: 500
        category: System
