module_name: manual_control
parameters:
- group: Manual Control
  definitions:
    MAN_ARM_GESTURE:
      description:
        short: Enable arm/disarm stick gesture
        long: |-
          This determines if moving the left stick to the lower right
          arms and to the lower left disarms the vehicle.
      type: boolean
      default: 1
    MAN_KILL_GEST_T:
      description:
        short: Trigger time for kill stick gesture
        long: |-
          The timeout for holding the left stick to the lower left
          and the right stick to the lower right at the same time until the gesture
          kills the actuators one-way.

          A negative value disables the feature.
      type: float
      default: -1.0
      unit: s
      decimal: 2
      min: -1
      max: 15
    MAN_DEADZONE:
      description:
        short: Deadzone for sticks (only specific use cases)
        long: |-
          Range around stick center ignored to prevent
          vehicle drift from stick hardware inaccuracy.

          Does not apply to any precise constant input like
          throttle and attitude or rate piloting.
      type: float
      default: 0.1
      min: 0
      max: 1
      decimal: 2
      increment: 0.01
    MAN_NORTH_REF:
      description:
        short: North-referenced sticks with a yaw-stick course offset
        long: |-
          For a multicopter that does not control its heading. In Stabilized, Altitude
          and Position (and their Slow/Cruise variants) the pitch/roll sticks are
          interpreted in a fixed WORLD frame instead of the vehicle's heading frame:
          full forward pitch tilts toward the course reference, full right roll 90 deg
          clockwise of it, whatever way the airframe is pointing.

          The yaw stick does not command a yaw rotation. It steers the course reference
          at up to MAN_CRS_RATE, starting from north (0) at every arm. The yaw stick is
          published as zero in those modes, so no downstream controller acts on it.

          Every other mode (Acro, Manual, the auto modes) is left untouched.
      type: boolean
      default: 1
    MAN_CRS_RATE:
      description:
        short: Course reference rate at full yaw stick
        long: |-
          How fast the yaw stick turns the course reference MAN_NORTH_REF measures the
          pitch/roll sticks from. MAN_DEADZONE is applied to the yaw stick first so a
          stick resting slightly off centre does not slowly steer the reference away.
      type: float
      default: 150.0
      unit: deg/s
      min: 1.0
      max: 360.0
      decimal: 0
      increment: 5.0
    MAN_OVERRIDE_SPD:
      description:
        short: Manual control override speed threshold
        long: >-
          Stick velocity above which the pilot regains control by switching to Position
          mode (or Altitude if position is unavailable). Unit: normalized stick travel
          per second — at 1.0, moving a stick half its range in ~0.5s triggers it.
          A negative value disables the feature. Only applies to multicopters and VTOLs in MC mode.
      type: float
      default: 1
      unit: '1/s'
      min: -1
      max: 10.0
      decimal: 1
      increment: 0.5
